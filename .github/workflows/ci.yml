name: Currency Converter CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML file
  run: |
    test -f index.html
    grep -q "</html>" index.html

      - name: Check JavaScript files
        run: test -d js

      - name: Check CSS files
        run: test -d css

      - name: Run basic project test
        run: |
          echo "Currency Converter files checked successfully."
          echo "CI test passed."